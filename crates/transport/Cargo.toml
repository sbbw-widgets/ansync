[package]
name = "ansync-transport"
version = "0.1.0"
publish = false
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ansync — transport abstraction with ZUDP + Noise XX encrypted default"

[dependencies]
ansync-core.workspace = true
ansync-crypto.workspace = true
ansync-proto.workspace = true
async-trait.workspace = true
bytes.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ed25519-dalek.workspace = true
parking_lot = "0.12"

zudp = { path = "../../../zudp", default-features = false, features = ["security", "discovery"] }

[dev-dependencies]
ansync-proto.workspace = true
postcard.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[package.metadata.release]
release = false
